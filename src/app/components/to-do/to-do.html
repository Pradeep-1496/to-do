<h1>To Do</h1>
<div>
  <input [(ngModel)]="task" name="task" placeholder="Enter a task" />
  <button (click)="getTask()" class="btn btn-primary">Add Task</button>
</div>
<br />
<br />

@for (item of taskList; track item.id) {
  <ul>
    <li>
      {{ item.id }}
    </li>
    <li>
      {{ item.task }}
    </li>

    <li>
      <button class="btn btn-danger" (click)="delete(item.id)">delete</button>
    </li>
  </ul>
}
